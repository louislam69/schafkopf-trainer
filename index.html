<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14352b" />
<title>Schafkopf-Trainer</title>
<link rel="stylesheet" href="styles.css" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
</head>
<body>

<header class="bar">
  <div class="brand">
    <span class="brand-mark">S</span>
    <span>Schafkopf<em>Trainer</em></span>
  </div>
  <div id="scoreboard" class="scoreboard"></div>
  <div class="bar-tools">
    <label class="lvl">Gegner
      <select id="level" aria-label="Spielstärke der Gegner"></select>
    </label>
    <button type="button" id="newhand" class="ghostbtn">Neues Blatt</button>
    <button type="button" id="resetscore" class="ghostbtn quiet" title="Punktestand zurücksetzen">↺</button>
  </div>
</header>

<main>
  <section id="view-spiel" class="on">
    <div id="status" class="status"></div>

    <div class="felt">
      <div id="seat-2" class="seatpos north"></div>
      <div id="seat-1" class="seatpos west"></div>
      <div id="seat-3" class="seatpos east"></div>
      <div id="trick" class="trick"></div>
      <div id="banner" class="banner"></div>
      <div id="rueckschau" class="rueckschau" hidden></div>
    </div>

    <div class="stichzeile">
      <p id="tricknote" class="tricknote"></p>
      <button type="button" id="letzterstich" class="ghostbtn quiet" hidden>Letzter Stich</button>
    </div>
    <div class="handzeile">
      <div id="hand" class="hand"></div>
      <button type="button" id="spritze" class="spritzebtn" hidden></button>
    </div>
    <p id="handnote" class="handnote"></p>
  </section>

  <section id="view-auswertung"></section>

  <section id="view-uebung"></section>

  <section id="view-regeln">
    <h2>Regeln &amp; Prinzipien</h2>
    <input id="rulesearch" type="search" placeholder="Suchen: Laufende, schmieren, Wenz …" />
    <div id="rules-body"></div>
  </section>
</main>

<nav class="tabs">
  <button type="button" data-tab="spiel" class="on">Spiel</button>
  <button type="button" data-tab="auswertung">Auswertung</button>
  <button type="button" data-tab="uebung">Übung</button>
  <button type="button" data-tab="regeln">Regeln</button>
</nav>

<div id="modal" class="modal"></div>

<script type="module" src="src/ui.js"></script>
<script>
  // nur in der veröffentlichten Version cachen, nie auf localhost
  if (location.protocol === "https:" && "serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
